name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (pre-commit)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        env:
          PYTHONPATH: back-end/src
        run: uv run pytest -q tests --maxfail=3 --disable-warnings
