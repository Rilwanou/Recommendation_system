[project]
name = "recommendation-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "pydantic",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_ingestion", "src/data_preprocessing", "src/modelisation"]
