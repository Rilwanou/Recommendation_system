[project]
name = "recommendation-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.3",
    "fastapi>=0.124.4",
    "joblib==1.5.2",
    "pandas>=2.3.3",
    "scikit-learn==1.7.2",
    "streamlit==1.51.0",
]

[dependency-groups]
dev = ["build>=1.3.0", "pre-commit>=4.5.0", "ruff>=0.14.9"]
test = ["pytest>=9.0.2"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "back-end/src/data_ingestion",
  "back-end/src/data_preprocessing",
  "back-end/src/modelisation",
]
