[project]
name = "recommendation-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "fastapi>=0.124.4",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.29",
    "pytest",
    "streamlit>=1.52.2",
    "requests>=2.32.5",
]

[dependency-groups]
dev = ["build>=1.3.0", "pre-commit>=4.5.0", "ruff>=0.14.9"]
test = ["pytest>=9.0.2"]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "back-end/src/data_ingestion",
  "back-end/src/data_preprocessing",
  "back-end/src/modelisation",
]
